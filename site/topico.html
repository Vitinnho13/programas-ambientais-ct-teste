  <meta name="theme-color" content="#f58220">
  <style>
    .cycle-slider{background:var(--color-white);border-radius:var(--radius-md);box-shadow:var(--shadow-md);border:1px solid var(--color-border);padding:2.5rem;margin-block:0;position:relative}
    .cycle-progress{height:4px;width:100%;background:var(--color-border);border-radius:2px;margin-bottom:2rem;overflow:hidden}
    .cycle-progress-bar{height:100%;background:var(--color-orange);width:0%;transition:width .35s cubic-bezier(.4,0,.2,1)}
    .cycle-display{display:flex;flex-direction:column;align-items:center;gap:1.5rem;text-align:center;margin-bottom:2.5rem;min-height:200px}
    @media(min-width:768px){.cycle-display{flex-direction:row;text-align:left;gap:3rem}}
    .cycle-emoji{font-size:5rem;line-height:1;transition:transform .35s,opacity .35s}
    .cycle-dots{display:flex;justify-content:center;gap:.5rem;margin-bottom:1.5rem}
    .cycle-dot{width:12px;height:12px;border-radius:50%;background:var(--color-border);border:none;padding:0;cursor:pointer;transition:background .2s}
    .cycle-dot.is-active{background:var(--color-orange)}
    .cycle-controls{display:flex;justify-content:space-between;align-items:center}
  </style>
</head>
